name: (^_^) OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Ревьюим только PR от людей и не трогаем draft PR.
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: |
            Проведи предварительное ревью этого pull request.

            Режим работы:
            - Ты работаешь строго в режиме ревью PR.
            - Не редактируй файлы.
            - Не создавай коммиты.
            - Не пушь изменения.
            - Не применяй исправления автоматически.
            - Не меняй рабочую ветку.
            - Не используй команды, которые изменяют рабочее дерево или историю Git.
            - Только анализируй diff pull request и оставляй review/comment с замечаниями.
            - Если нашел проблему, опиши ее и предложи исправление, но не меняй код самостоятельно.

            Контекст проекта:
            - Это учебный Go-проект Hexlet "Парсер сайтов".
            - Основные проверки: корректность логики, тестируемость, читаемость, простота решения.
            - Не требуй больших архитектурных переписываний без явной необходимости.
            - Не придирайся к вкусовым вещам, если они не влияют на поддержку кода.
            - Обращай внимание на обработку ошибок, HTTP-сценарии, тесты, edge cases и соответствие требованиям задания.
            - Если поведение неоднозначно по заданию, не называй его багом. Сформулируй как вопрос или риск.

            Формат ответа:
            - Сначала короткое резюме.
            - Затем список найденных проблем, если они есть.
            - Для каждой проблемы укажи файл/место, почему это важно и как исправить.
            - Если критичных проблем нет, так и напиши.
            - Пиши по-русски.
